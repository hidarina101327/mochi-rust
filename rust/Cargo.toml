[workspace]
resolver = "2"
members = ["crates/mochi-core", "crates/mochi-app", "crates/mochi-blocks", "crates/mochi-installer"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# 保留会话 JSON 的原键序，避免读写时重排历史消息。
# 画布坐标与内容修订号必须经 JSON 读写后原样保留。
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 开发期的优化构建单独存放，避免与正在运行的 Debug 可执行文件互相干扰。
[profile.native-dev]
inherits = "dev"
opt-level = 1
debug = 1
