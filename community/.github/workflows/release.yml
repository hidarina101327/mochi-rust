name: Publish community packages

on:
  push:
    tags: ["market-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing market-v* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: community-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build independent release assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/package-release.py --root . --output dist --tag "$RELEASE_TAG"
      - name: Publish complete catalog and ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Independent Mochi community packages. Download only the package you need."
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
